name: Build and Push Docker Image (On Release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the branch/tag name)"
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  # The fork publishes only to its own GHCR namespace. Upstream hardcodes
  # "pasarguard/" here and also pushes to Docker Hub; neither applies to us.
  IMAGE_NAME: free-guy-ir/node

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Docker tags
        id: tags
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          if [ -z "$VERSION" ]; then VERSION="${{ github.ref_name }}"; fi
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "DOCKER_TAGS=${BASE}:${VERSION}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAGS=${BASE}:${VERSION},${BASE}:latest" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
