name: Test Modules

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "dev"
      - "wg"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
          check-latest: true

      - name: Get project dependencies
        run: make deps

      - name: Install xray-core
        run: make install_xray

      - name: install wg
        run: make install_wg

      - name: Create certificate
        run: |
          mkdir -p certs
          make generate_server_cert
          make generate_client_cert

      - name: Run regular test suite
        run: TEST_INTEGRATION=true go test ./... -v -p 1

      - name: Run wireguard integration tests
        run: sudo -E make test-integration-wireguard

  mtproto-fronting:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
          check-latest: true

      - name: Get project dependencies
        run: make deps

      - name: Run the MTProto domain-fronting leg
        run: |
          for attempt in 1 2 3; do
            if make test-integration-mtproto; then
              echo "fronting leg passed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 10
          done
          echo "the fronting leg failed three times; that is beyond network flake"
          exit 1
