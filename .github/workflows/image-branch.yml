name: Build and Push Docker Image (All Branches)

on:
  push:
    branches: ['*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml

  drift:
    uses: ./.github/workflows/upstream-drift.yml

  image:
    needs: [tests, drift]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      tags: ${{ github.ref_name }}
      branch: ${{ github.ref_name }}
