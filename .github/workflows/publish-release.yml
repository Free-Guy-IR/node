name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release tag that is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_re='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "::error title=Run this from the release tag::Publish Release was dispatched from ${GITHUB_REF}; dispatch it with the draft release's tag as the ref"
            exit 1
          fi
          if ! [[ ${GITHUB_REF_NAME} =~ ${tag_re} ]]; then
            echo "::error title=Tag is not an image tag::'${GITHUB_REF_NAME}' cannot be used as an image tag"
            exit 1
          fi
          status=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          case "${status}" in
            404)
              echo "Releasing ${GITHUB_REF_NAME} at ${GITHUB_SHA}; the draft release is checked again before it is published." >> "$GITHUB_STEP_SUMMARY"
              ;;
            200)
              echo "::error title=Release already published::${GITHUB_REF_NAME} already has a published release"
              exit 1
              ;;
            *)
              echo "::error title=Release lookup failed::GitHub returned HTTP ${status} for the release of ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: Require the tag commit to be on main or a release branch
        run: |
          if ! git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/release/**' > "$RUNNER_TEMP/branches"; then
            echo "::error title=Cannot list the branches::git for-each-ref failed, so the tag commit cannot be checked against main and the release branches"
            exit 1
          fi
          refs=()
          while IFS= read -r ref; do
            [ -n "${ref}" ] && refs+=("${ref}")
          done < "$RUNNER_TEMP/branches"
          if [ "${#refs[@]}" = 0 ]; then
            echo "::error title=No branches to check::no origin/main or origin/release/** refs are present; the checkout must fetch them with fetch-depth 0"
            exit 1
          fi
          on=""
          for ref in "${refs[@]}"; do
            if git merge-base --is-ancestor "${GITHUB_SHA}" "${ref}"; then
              on="${ref#refs/remotes/origin/}"
              break
            fi
          done
          if [ -z "${on}" ]; then
            echo "::error title=Tag is not on a released branch::${GITHUB_REF_NAME} (${GITHUB_SHA}) is on neither main nor a release/** branch, so its workflow files are not the reviewed ones; tag a commit that is on main or a release/** branch"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on ${on}; releasing ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"

  tests:
    needs: resolve
    uses: ./.github/workflows/run-tests.yml

  drift:
    needs: resolve
    uses: ./.github/workflows/upstream-drift.yml

  assets:
    needs: [tests, drift]
    strategy:
      matrix:
        # Include amd64 on all platforms.
        goos:
          # - windows
          # - freebsd
          - openbsd
          - linux
          # - darwin

        goarch: [amd64, 386]
        gotoolchain: [""]
        patch-assetname: [""]

        # exclude:

        include:
          # BEGIN MacOS ARM64
          # - goos: darwin
          #   goarch: arm64
          # END MacOS ARM64
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
          # Windows ARM
          # - goos: windows
          #   goarch: arm64
          # - goos: windows
          #   goarch: arm
          #   goarm: 7
          # BEGIN Other architectures
          # BEGIN ARM64
          - goos: linux
            goarch: arm64
          # END ARM64
          #BEGIN riscv64 & LOONG64
          # - goos: linux
          #   goarch: riscv64
          # - goos: linux
          #   goarch: loong64
          # END riscv64 &  LOONG64
          # BEGIN MIPS
          # - goos: linux
          #   goarch: mips64
          # - goos: linux
          #   goarch: mips64le
          # - goos: linux
          #   goarch: mipsle
          # - goos: linux
          #   goarch: mips
          # END MIPS
          # BEGIN PPC
          # - goos: linux
          #   goarch: ppc64
          # - goos: linux
          #   goarch: ppc64le
          # END PPC
          # BEGIN FreeBSD ARM
          # - goos: freebsd
          #   goarch: arm64
          # - goos: freebsd
          #   goarch: arm
          #   goarm: 7
          # END FreeBSD ARM
          # BEGIN S390X
          - goos: linux
            goarch: s390x
          # END S390X
          # END Other architectures
          # BEGIN OPENBSD ARM
          - goos: openbsd
            goarch: arm64
          # - goos: openbsd
          #   goarch: arm
          #   goarm: 7
          # END OPENBSD ARM
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Show workflow information
        run: |
          _GOARM="${GOARM:-""}"
          if [ -n "$_GOARM" ]; then
            _NAME="${GOOS}-${GOARCH}-${_GOARM}"
          else
            _NAME="${GOOS}-${GOARCH}"
          fi
          echo "ASSET_NAME=$_NAME" >> "$GITHUB_ENV"
          echo "BINARY_NAME=pasarguard-node-${_NAME}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - name: Get project dependencies
        run: make deps

      - name: Build binary and zip
        run: |
          make
          find . -type f -name "pasarguard-node*" -exec mv {} "./pasarguard-node-${{ env.ASSET_NAME }}" \;
          # Create zip file with max compression and include README & LICENSE
          zip -9 "./pasarguard-node-${{ env.ASSET_NAME }}.zip" "./pasarguard-node-${{ env.ASSET_NAME }}" README.md LICENSE

      - name: Checksum the release asset
        env:
          ASSET: pasarguard-node-${{ env.ASSET_NAME }}.zip
        run: sha256sum "${ASSET}" > "${ASSET}.sha256"

      - name: Hand the asset to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ env.ASSET_NAME }}
          path: |
            pasarguard-node-${{ env.ASSET_NAME }}.zip
            pasarguard-node-${{ env.ASSET_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [tests, drift]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml

  publish:
    needs: [assets, image]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/free-guy-ir/node
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find the draft release for this tag
        id: draft
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq -s --arg tag "${TAG}" '[.[][] | select(.tag_name == $tag)]' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/matches.json"
          count=$(jq length "$RUNNER_TEMP/matches.json")
          if [ "${count}" != 1 ]; then
            echo "::error title=No single draft release::found ${count} releases for ${TAG}; create one draft release on that tag, then run this workflow again"
            exit 1
          fi
          if [ "$(jq -r '.[0].draft' "$RUNNER_TEMP/matches.json")" != true ]; then
            echo "::error title=Release already published::the release for ${TAG} is not a draft any more"
            exit 1
          fi
          id=$(jq -r '.[0].id' "$RUNNER_TEMP/matches.json")
          if ! [[ ${id} =~ ^[0-9]+$ ]]; then
            echo "::error title=No release id::the draft release for ${TAG} has the id '${id}'"
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r '.[0].prerelease' "$RUNNER_TEMP/matches.json")" >> "$GITHUB_OUTPUT"

      - name: Check that the tag still points at the tested commit
        run: |
          now=$(bash scripts/release_tag_commit.sh "${TAG}")
          if [ "${now}" != "commit ${GITHUB_SHA}" ]; then
            echo "::error title=Tag moved::${TAG} now points at ${now}, but the gates tested ${GITHUB_SHA}"
            exit 1
          fi
          if ! [[ ${DIGEST} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=No image digest::the image job returned '${DIGEST}'"
            exit 1
          fi

      - name: Collect the assets
        uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      - name: Verify the asset checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          zips=(pasarguard-node-*.zip)
          if [ "${#zips[@]}" = 0 ]; then
            echo "::error title=No assets::the build jobs produced no zip"
            exit 1
          fi
          for zip in "${zips[@]}"; do
            sha256sum -c "${zip}.sha256"
          done

      - name: Upload the assets to the draft release
        run: gh release upload "${TAG}" dist/* --clobber

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag the tested image
        run: |
          existing=""
          if manifest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/inspect.err"); then
            existing=$(jq -r .digest <<< "${manifest}")
          elif ! grep -Eqi ': not found|manifest unknown' "$RUNNER_TEMP/inspect.err"; then
            echo "::error title=Registry lookup failed::cannot tell whether ${IMAGE}:${TAG} exists: $(tr '\n' ' ' < "$RUNNER_TEMP/inspect.err")"
            exit 1
          fi
          if [ -z "${existing}" ]; then
            docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${IMAGE}@${DIGEST}"
            echo "Tagged ${IMAGE}@${DIGEST} as ${TAG}." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${existing}" = "${DIGEST}" ]; then
            echo "${IMAGE}:${TAG} already points at ${DIGEST}, the image this run built." >> "$GITHUB_STEP_SUMMARY"
          else
            msg="${IMAGE}:${TAG} already points at ${existing}, and this run built ${DIGEST}. Release image tags are never repointed. If an earlier Publish Release run for ${TAG} set it, re-run that run's failed jobs, which reuse its own image; otherwise release this commit under the next version."
            echo "::error title=Release image tag already taken::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Publish the release
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          now=$(bash scripts/release_tag_commit.sh "${TAG}")
          if [ "${now}" != "commit ${GITHUB_SHA}" ]; then
            echo "::error title=Tag moved::${TAG} now points at ${now}, but the gates tested ${GITHUB_SHA}; the release stays a draft"
            exit 1
          fi
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")
          if [ "$(jq -r .draft <<< "${release}")" != true ]; then
            echo "::error title=Release published while this run was in progress::the release for ${TAG} is no longer a draft, so it was published outside this run, and Release Guard turns it back into a draft. Once it is a draft again, re-run this run's failed jobs; they reuse this run's image and assets."
            exit 1
          fi
          gh release edit "${TAG}" --draft=false
          after=$(bash scripts/release_tag_commit.sh "${TAG}") || after="an unreadable object"
          if [ "${after}" != "commit ${GITHUB_SHA}" ]; then
            gh release edit "${TAG}" --draft=true
            echo "::error title=Tag moved while publishing::${TAG} now points at ${after}, but the gates tested ${GITHUB_SHA}; the release is a draft again"
            exit 1
          fi
          echo "Published ${TAG} at ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"

  latest:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/free-guy-ir/node
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Point :latest at the image of the latest release
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/latest.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/latest")
          case "${status}" in
            200) ;;
            404)
              echo "The repository has no published non-prerelease release, so :latest stays where it is." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "::error title=Latest release lookup failed::GitHub returned HTTP ${status} for the latest release; :latest stays where it is"
              exit 1
              ;;
          esac
          latest=$(jq -r .tag_name "$RUNNER_TEMP/latest.json")
          if ! [[ ${latest} =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error title=Latest release tag is not an image tag::'${latest}'; :latest stays where it is"
            exit 1
          fi
          if ! manifest=$(docker buildx imagetools inspect "${IMAGE}:${latest}" --format '{{json .Manifest}}'); then
            echo "::error title=No image for the latest release::${IMAGE}:${latest} cannot be read, so :latest stays where it is"
            exit 1
          fi
          wanted=$(jq -r .digest <<< "${manifest}")
          if ! [[ ${wanted} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=No digest for the latest release::${IMAGE}:${latest} has the digest '${wanted}'"
            exit 1
          fi
          current=""
          if manifest=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/inspect.err"); then
            current=$(jq -r .digest <<< "${manifest}")
          elif ! grep -Eqi ': not found|manifest unknown' "$RUNNER_TEMP/inspect.err"; then
            echo "::error title=Registry lookup failed::cannot read ${IMAGE}:latest: $(tr '\n' ' ' < "$RUNNER_TEMP/inspect.err")"
            exit 1
          fi
          if [ "${current}" = "${wanted}" ]; then
            echo ":latest already points at ${latest} (${wanted})." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${wanted}"
          echo "Moved :latest from ${current:-nothing} to ${latest} (${wanted})." >> "$GITHUB_STEP_SUMMARY"
