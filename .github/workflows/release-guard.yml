name: Release Guard

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  refuse-hand-published:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Turn a release published outside Publish Release back into a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          ACTOR: ${{ github.actor }}
        run: |
          gh release edit --draft=true -- "${TAG}"
          how="gh workflow run publish-release.yml --ref ${TAG}"
          msg="${ACTOR} published ${TAG} outside the Publish Release workflow, so it had no tested assets or image. It is a draft again. To publish it correctly, run the Publish Release workflow by workflow_dispatch from the tag ${TAG}: ${how}"
          echo "::error title=Release turned back into a draft::${msg}"
          {
            echo "## Release turned back into a draft"
            echo
            echo "${ACTOR} published ${TAG} outside the Publish Release workflow, so it had no tested assets or image. It is a draft again."
            echo
            echo "To publish it correctly, run the Publish Release workflow by workflow_dispatch from the tag ${TAG}:"
            echo
            echo '```'
            echo "${how}"
            echo '```'
            echo
            echo "See the Releasing section of README.md."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
