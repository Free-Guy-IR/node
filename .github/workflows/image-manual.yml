name: Build and Push Docker Image (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom image tag, from main or a tag only; never latest, edge, main, a v<digit> or sha256- name, or the name of an existing release, tag or branch"
        required: false

permissions:
  contents: read

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      branch: ${{ steps.tags.outputs.branch }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Choose the image tags for this ref
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${GITHUB_REF_NAME}"
          branch=""
          tags=()
          case "${GITHUB_REF}" in
            refs/heads/main)
              branch=main
              case "${INPUT_TAG}" in
                edge|main)
                  echo "::error title=Custom image tag refused::${INPUT_TAG} is a moving tag with its own owner; edge is added to every manual build of main, and main belongs to the branch build"
                  exit 1
                  ;;
              esac
              if [ -n "${INPUT_TAG}" ]; then
                tags+=("${INPUT_TAG}")
              fi
              tags+=(edge)
              ;;
            refs/heads/*)
              branch="${name}"
              if [ -n "${INPUT_TAG}" ] && [ "${INPUT_TAG}" != "${name}" ]; then
                echo "::error title=Custom image tag refused::a custom tag is only allowed from main or from a tag; from branch ${name} the image is tagged ${name}"
                exit 1
              fi
              tags+=("${name}")
              ;;
            refs/tags/*)
              if [ -z "${INPUT_TAG}" ]; then
                echo "::error title=Release tags come only from Publish Release::${name} is a tag, and release image tags are immutable; publish a release with gh workflow run publish-release.yml --ref ${name}, or rebuild this tag under a custom tag that does not look like a release"
                exit 1
              fi
              case "${INPUT_TAG}" in
                edge|main)
                  echo "::error title=Custom image tag refused::${INPUT_TAG} is a moving tag with its own owner"
                  exit 1
                  ;;
              esac
              tags+=("${INPUT_TAG}")
              ;;
            *)
              echo "::error title=Unsupported ref::${GITHUB_REF}"
              exit 1
              ;;
          esac
          bash scripts/image_tag_policy.sh --branch "${branch}" "${tags[@]}"
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "Image tags: ${tags[*]} (dispatched from ${GITHUB_REF}); :latest is never moved by this workflow." >> "$GITHUB_STEP_SUMMARY"

  tests:
    uses: ./.github/workflows/run-tests.yml

  drift:
    uses: ./.github/workflows/upstream-drift.yml

  image:
    needs: [tags, tests, drift]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      tags: ${{ needs.tags.outputs.tags }}
      branch: ${{ needs.tags.outputs.branch }}
