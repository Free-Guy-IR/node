syntax = "proto3";

package service;

option go_package = "github.com/pasarguard/node/common";

message Empty {}

// Base info response message
message BaseInfoResponse {
  bool started = 1;
  string core_version = 2;
  string node_version = 3;
}

enum BackendType {
  XRAY = 0;
  WIREGUARD = 1;
  SING_BOX = 2;
  OPEN_VPN = 3;
  MTPROTO = 4;
}

message Backend {
  BackendType type = 1;
  string config = 2;
  repeated User users = 3;
  uint64 keep_alive = 4;
  repeated string exclude_inbounds = 5;
}

// log
message Log {
    string detail = 1;
}

// stats
message Stat {
  string name = 1;
  string type = 2;
  string link = 3;
  int64 value = 4;
}

message StatResponse {
  repeated Stat stats = 1;
}

enum StatType {
  Outbounds = 0;
  Outbound = 1;
  Inbounds = 2;
  Inbound = 3;
  UsersStat = 4;
  UserStat = 5;
}

message StatRequest {
  string name = 1;
  bool reset = 2;
  StatType type = 3;
}

message OnlineStatResponse {
  string name = 1;
  int64 value = 2;
}

message StatsOnlineIpListResponse {
  string name = 1;
  map<string, int64> ips = 2;
}

message Latency {
  string name = 1;
  bool alive = 2;
  int64 delay = 3;
  string link = 4;
  int64 last_seen_time = 5;
  int64 last_try_time = 6;
  string source = 7;
}

message LatencyRequest {
  string name = 1;
}

message LatencyResponse {
  repeated Latency latencies = 1;
}

message BackendStatsResponse {
    uint32 num_goroutine = 1;
    uint32 num_gc = 2;
    uint64 alloc = 3;
    uint64 total_alloc = 4;
    uint64 sys = 5;
    uint64 mallocs = 6;
    uint64 frees = 7;
    uint64 live_objects = 8;
    uint64 pause_total_ns = 9;
    uint32 uptime = 10;
}

message SystemStatsResponse {
    uint64 mem_total = 1;
    uint64 mem_used = 2;
    uint64 cpu_cores = 3;
    double cpu_usage = 4;
    uint64 incoming_bandwidth_speed = 5;
    uint64 outgoing_bandwidth_speed = 6;
    uint64 uptime = 7;
}

// User
message Vmess {
    string id = 1;
}

message Vless {
    string id = 1;
    string flow = 2;
}

message Trojan {
    string password = 1;
}

message Shadowsocks {
    string password = 1;
    string method = 2;
}

message Wireguard {
    string public_key = 1;
    repeated string peer_ips = 2;
}

message Hysteria {
    string auth = 1;
}

// sing-box Hysteria2 inbound user credential (distinct from xray-core's
// native "Hysteria" v1 auth string above — Hysteria2 uses a password).
message Hysteria2 {
    string password = 1;
}

// OpenVPN uses --auth-user-pass-verify / --management-client-auth
// (no per-user client certificate) - username plus password is the full
// per-user credential, matching every other password-based protocol here.
message OpenVpnUser {
    string username = 1;
    string password = 2;
    // Max concurrent OpenVPN sessions allowed for this user, reusing the
    // panel-wide User.hwid_limit field's numeric value (0 or unset = unlimited).
    // This is a concurrent-connection cap, distinct from hwid_limit'''s original
    // meaning for Xray (a cap on distinct device fingerprints ever seen) - OpenVPN
    // has no comparable device-fingerprint concept, so the same admin-facing number
    // is reinterpreted here as a live-session cap instead.
    uint32 max_concurrent_connections = 3;
}

// MTProto (Telegram) proxy credential. Unlike every other protocol here,
// many users share ONE listener/process (see backend/mtproto) - secret is
// this user's individual MTProto secret (16 bytes, hex-encoded, no "ee"
// prefix/host suffix - the backend derives the full client-facing secret
// from this plus the instance's own fake-TLS domain).
message MtprotoUser {
    string username = 1;
    string secret = 2;
}

message Tuic {
    string uuid = 1;
    string password = 2;
}

message Proxy {
    Vmess vmess = 1;
    Vless vless = 2;
    Trojan trojan = 3;
    Shadowsocks shadowsocks = 4;
    Wireguard wireguard = 5;
    Hysteria hysteria = 6;
    Hysteria2 hysteria2 = 7;
    OpenVpnUser open_vpn = 8;
    MtprotoUser mtproto = 9;
    Tuic tuic = 10;
}

message User {
    string email = 1;
    Proxy proxies = 2;
    repeated string inbounds = 3;
}

message Users {
  repeated User users = 1;
}

message UsersChunk {
  repeated User users = 1;
  uint64 index = 2;
  bool last = 3;
}

// Service for node management and connection
service NodeService {
  rpc Start (Backend) returns (BaseInfoResponse) {}
  rpc Stop (Empty) returns (Empty) {}
  rpc GetBaseInfo (Empty) returns (BaseInfoResponse) {}

  rpc GetLogs (Empty) returns (stream Log) {}

  rpc GetSystemStats (Empty) returns (SystemStatsResponse) {}
  rpc GetBackendStats (Empty) returns (BackendStatsResponse) {}

  rpc GetStats (StatRequest) returns (StatResponse) {}
  rpc GetOutboundsLatency (LatencyRequest) returns (LatencyResponse) {}

  rpc GetUserOnlineStats (StatRequest) returns (OnlineStatResponse) {}
  rpc GetUserOnlineIpListStats(StatRequest) returns (StatsOnlineIpListResponse) {}

  rpc SyncUser (stream User) returns (Empty) {}
  rpc SyncUsers (Users) returns (Empty) {}
  rpc SyncUsersChunked (stream UsersChunk) returns (Empty) {}
}
