syntax = "proto3";

// This is a minimal, hand-written re-declaration of the gRPC surface sing-box's
// experimental.v2ray_api StatsService actually implements - NOT xray-core's
// newer "xray.app.stats.command.StatsService". sing-box registers the legacy
// v2ray/v2fly service name and shape (see
// experimental/v2rayapi/stats.go/.proto in the sing-box source, tag v1.13.14):
// `StatsService_ServiceDesc.ServiceName = "v2ray.core.app.stats.command.StatsService"`.
// A client built against xtls/xray-core's app/stats/command package fails
// against sing-box with "Unimplemented desc = unknown service
// xray.app.stats.command.StatsService" - do not switch this back to that
// package. Field numbers/types below are copied 1:1 from sing-box's real
// experimental/v2rayapi/stats.proto so this stays wire-compatible; only the
// unimplemented GetStatsList RPC (present in an earlier exploration proto, but
// never actually registered by sing-box's server) has been dropped.
package v2ray.core.app.stats.command;

option go_package = "github.com/pasarguard/node/backend/singbox/api/proto";

message GetStatsRequest {
  string name = 1;
  bool reset = 2;
}

message Stat {
  string name = 1;
  int64 value = 2;
}

message GetStatsResponse {
  Stat stat = 1;
}

// IMPORTANT: sing-box's QueryStats handler filters using `patterns` (field 3,
// repeated) and `regexp` (field 4) - it never reads the older singular
// `pattern` (field 1), even though that field is still accepted on the wire.
// Sending only `pattern` silently returns ALL counters, unfiltered. Always
// populate `patterns` from client code (see api/stats.go's QueryStats helper).
message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
  repeated string patterns = 3;
  bool regexp = 4;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

message SysStatsRequest {}

message SysStatsResponse {
  uint32 NumGoroutine = 1;
  uint32 NumGC = 2;
  uint64 Alloc = 3;
  uint64 TotalAlloc = 4;
  uint64 Sys = 5;
  uint64 Mallocs = 6;
  uint64 Frees = 7;
  uint64 LiveObjects = 8;
  uint64 PauseTotalNs = 9;
  uint32 Uptime = 10;
}

service StatsService {
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse) {}
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse) {}
  rpc GetSysStats(SysStatsRequest) returns (SysStatsResponse) {}
}
